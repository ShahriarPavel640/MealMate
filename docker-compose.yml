version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.4-alpine
    container_name: mealmate_postgres_db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mealmate
    volumes:
      - mealmate_pgdata:/var/lib/postgresql/data
      - ./mealmate.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./populate.sql:/docker-entrypoint-initdb.d/2-seed.sql

  redis:
    image: redis:alpine
    container_name: mealmate_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  pgadmin:
    image: dpage/pgadmin4
    container_name: mealmate_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"

volumes:
  mealmate_pgdata:
