name: mealmate
services:
  db:
    image: postgis/postgis:15-3.4-alpine
    container_name: mealmate_postgres_db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mealmate
    volumes:
      - mealmate_pgdata:/var/lib/postgresql/data
      - ./mealmate.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./populate.sql:/docker-entrypoint-initdb.d/2-seed.sql

  redis:
    image: redis:alpine
    container_name: mealmate_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  pgadmin:
    image: dpage/pgadmin4
    container_name: mealmate_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"

  backend:
    build:
      context: ./backend
    container_name: mealmate_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - PORT=5000
      - FRONTEND_URL=http://localhost:5174
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=mealmate
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: mealmate_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5174:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  mealmate_pgdata:
    name: food_panda_mealmate_pgdata
    external: true
