name: mealmate
services:
  db:
    image: postgis/postgis:15-3.4-alpine
    container_name: mealmate_postgres_db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mealmate
    volumes:
      - mealmate_pgdata:/var/lib/postgresql/data
      - ./mealmate.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./populate.sql:/docker-entrypoint-initdb.d/2-seed.sql

  redis:
    image: redis:alpine
    container_name: mealmate_redis
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: mealmate_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"

  backend:
    build:
      context: ./backend
    container_name: mealmate_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - PORT=5000
      - SENTRY_DSN=https://534fe3aadb5ae51c767ee7b9802464fc@o4511875651600384.ingest.de.sentry.io/4511875675062352
      - FRONTEND_URL=http://localhost:5173
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=mealmate
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: mealmate_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
      - VITE_SENTRY_DSN=https://534fe3aadb5ae51c767ee7b9802464fc@o4511875651600384.ingest.de.sentry.io/4511875675062352
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  loki:
    image: grafana/loki:latest
    container_name: mealmate_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: mealmate_promtail
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: mealmate_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: mealmate_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped

volumes:
  mealmate_pgdata:
    name: food_panda_mealmate_pgdata
    external: true
  loki-data:
  grafana-data:
  prometheus-data:
