# ==============================================================================
# POSTGRESQL (POSTGIS) DEPLOYMENT & SERVICE
# ==============================================================================
# This file defines two core Kubernetes objects:
# 1. Deployment: Controls the container runtime, storage mounts, and resource limits.
# 2. Service (ClusterIP): Creates a stable internal network DNS name ("db:5432").
# ==============================================================================

# API version for workload controllers (Deployments, DaemonSets, StatefulSets)
apiVersion: apps/v1

# The kind of Kubernetes resource being created
kind: Deployment

# Metadata: Identifies the resource within the cluster
metadata:
  name: db
  labels:
    app: db # Logical label used for grouping, monitoring, and service selection

# Specification: Defines the desired state of the Deployment
spec:
  # Maintain exactly 1 pod replica. Relational databases with local PVCs cannot run multiple
  # concurrent writer replicas without distributed replication (like Patroni or cloud DBs).
  replicas: 1

  # Label selector: The Deployment manages any pod matching these labels
  selector:
    matchLabels:
      app: db

  # Strategy: How Kubernetes replaces old pods with new pods during updates.
  # "Recreate" terminates the running pod BEFORE starting the new pod.
  # This is MANDATORY for ReadWriteOnce volumes so the persistent disk is unlocked before reattachment.
  strategy:
    type: Recreate

  # Pod Template: Blueprint used by Kubernetes to create the actual database pod
  template:
    metadata:
      labels:
        app: db # Must match spec.selector.matchLabels above
    spec:
      containers:
        - name: postgres
          # PostGIS image providing PostgreSQL 15 with geospatial extension support
          image: postgis/postgis:15-3.4-alpine

          # Expose the standard PostgreSQL port inside the container network namespace
          ports:
            - containerPort: 5432
              name: postgres

          # envFrom: Automatically loads all key-value pairs from 'postgres-secret' as environment variables:
          # (POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB) required by the official postgres image.
          envFrom:
            - secretRef:
                name: postgres-secret

          # Mount storage volumes into the container's file system
          volumeMounts:
            # 1. Mount persistent disk to standard PostgreSQL data directory (persists tables across restarts)
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

            # 2. Mount database initialization scripts (schema & seed)
            # The official image automatically executes any .sql files in /docker-entrypoint-initdb.d on first boot
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d

          # Resource governance: Guarantees minimum capacity and prevents out-of-memory container crashes
          resources:
            requests:
              cpu: 100m      # 0.1 CPU core reserved as baseline guarantee
              memory: 256Mi  # 256 Megabytes reserved
            limits:
              cpu: 1000m     # Max burst of 1 full CPU core
              memory: 1024Mi # Hard ceiling: Container killed if memory exceeds 1 GB

      # Volumes attached to the pod template
      volumes:
        # Reference the PersistentVolumeClaim defined in postgres-pvc.yaml
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc

        # Reference the ConfigMap generated by Kustomize containing 1-schema.sql and 2-seed.sql
        - name: init-scripts
          configMap:
            name: postgres-init-scripts

---
# ==============================================================================
# POSTGRESQL INTERNAL SERVICE (ClusterIP)
# ==============================================================================
# Provides a static internal IP address and local DNS entry ("db:5432").
# Even if the PostgreSQL pod dies and restarts with a new private IP,
# backend pods can always connect reliably to "db:5432".
# ==============================================================================

apiVersion: v1
kind: Service
metadata:
  name: db # Stable DNS hostname accessible by other pods within the same namespace
  labels:
    app: db
spec:
  # ClusterIP: Only accessible from inside the Kubernetes cluster (not exposed to the internet)
  type: ClusterIP

  ports:
    - port: 5432        # Port the Service listens on internally
      targetPort: 5432  # Port on the container where traffic is forwarded
      name: postgres

  # Routes incoming connections to any pod that has the label "app: db"
  selector:
    app: db
