# ==============================================================================
# POSTGRESQL CREDENTIALS SECRET
# ==============================================================================
# Kubernetes Secret object used to hold sensitive connection parameters.
# Using 'stringData' allows plain-text input in local files which Kubernetes
# automatically encodes to base64 upon applying to the cluster.
# In production, this can be injected via CI/CD secrets or SealedSecrets.
# ==============================================================================

apiVersion: v1
kind: Secret

metadata:
  name: postgres-secret # Referenced in postgres-deployment.yaml via envFrom.secretRef

# Standard Opaque secret type for arbitrary user-defined key-value credentials
type: Opaque

# Key-value pairs matching the environment variables expected by the official PostGIS container
stringData:
  POSTGRES_USER: "postgres"       # Database superuser name
  POSTGRES_PASSWORD: "postgres"   # Database superuser password
  POSTGRES_DB: "mealmate"         # Default database created on initialization
