# ==============================================================================
# BACKEND SECRETS
# ==============================================================================
# Holds private API keys, cryptographic secrets, and payment gateway tokens.
# In a local development cluster, this file provides baseline testing values.
# In production on a VPS:
# - These values can be overwritten at deploy-time using GitHub Actions Secrets.
# ==============================================================================

apiVersion: v1
kind: Secret

metadata:
  name: backend-secret

type: Opaque

stringData:
  # Database authentication password matching postgres-secret
  DB_PASSWORD: "postgres"

  # Secret key used for signing and verifying JSON Web Tokens (auth cookies/headers)
  JWT_SECRET: "development_jwt_secret_key"

  # Sentry Data Source Name (DSN) for backend crash reporting and telemetry
  SENTRY_DSN: "https://examplePublicKey@o0.ingest.sentry.io/0"

  # Cloudinary credentials for restaurant food image uploads and CDN hosting
  CLOUDINARY_CLOUD_NAME: "change_me"
  CLOUDINARY_API_KEY: "000000000000000"
  CLOUDINARY_API_SECRET: "change_me"

  # SSLCommerz sandbox merchant credentials for test payments
  SSL_COMMERZ_STORE_ID: "change_me"
  SSL_COMMERZ_STORE_PASSWORD: "change_me"

  # Google Cloud Maps / Gemini AI API key
  GOOGLE_API_KEY: "change_me"
