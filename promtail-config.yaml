server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: system
    static_configs:
    - targets:
        - localhost
      labels:
        job: varlogs
        __path__: /var/log/*log

  - job_name: docker
    static_configs:
    - targets:
        - localhost
      labels:
        job: docker
        __path__: /var/lib/docker/containers/*/*log
    pipeline_stages:
      - docker: {}
      - match:
          # If the log contains JSON, parse it (Winston logs)
          selector: '{job="docker"}'
          stages:
            - json:
                expressions:
                  level: level
                  message: message
            - labels:
                level:
