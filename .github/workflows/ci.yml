name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  backend-checks:
    name: Backend Tests
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5434
      DB_USER: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5434/test_mealmate?schema=public"
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: test_secret
      SSL_COMMERZ_STORE_ID: test_store_id
      SSL_COMMERZ_STORE_PASSWORD: test_store_password
      FRONTEND_URL: http://localhost:5173
      VITE_API_URL: http://127.0.0.1:5000
    
    services:
      postgres:
        image: postgis/postgis:15-3.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Run Backend Tests
        working-directory: ./backend
        run: npm test

  frontend-checks:
    name: Frontend Lint & Build
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Linter
        working-directory: ./frontend
        run: npm run lint

      - name: Build Application
        working-directory: ./frontend
        run: npm run build

  e2e-ui-tests:
    name: E2E UI Tests
    needs: [backend-checks, frontend-checks, changes]
    if: ${{ always() && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5434
      DB_USER: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5434/test_mealmate?schema=public"
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: test_secret
      SSL_COMMERZ_STORE_ID: test_store_id
      SSL_COMMERZ_STORE_PASSWORD: test_store_password
      FRONTEND_URL: http://localhost:5173
      VITE_API_URL: http://127.0.0.1:5000
      
    services:
      postgres:
        image: postgis/postgis:15-3.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client & Setup DB
        working-directory: ./backend
        run: |
          npx prisma generate
          npx prisma db push --force-reset

      - name: Start Backend Server
        working-directory: ./backend
        run: |
          npm start &
          sleep 5

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Get Playwright Version
        id: playwright-version
        working-directory: ./frontend
        run: echo "PLAYWRIGHT_VERSION=$(npm ls @playwright/test | grep @playwright/test | awk '{print $2}')" >> $GITHUB_ENV

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: Run UI E2E Tests
        working-directory: ./frontend
        run: npx playwright test e2e/customer-flow.spec.js e2e/smoke.spec.js

  docker-build:
    name: Verify Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Images
        run: docker compose build

  cd-deploy:
    name: Continuous Deployment (Coming Soon)
    needs: [backend-checks, frontend-checks, e2e-ui-tests, docker-build]
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: CD Placeholder
        run: echo "CD Pipeline triggered because this is a Push to main or master! Real deployment steps are currently commented out."





